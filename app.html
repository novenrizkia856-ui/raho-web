<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raho | Post Quantum Smart Account Migration</title>
    <meta name="description" content="The migration layer for moving blockchain accounts to post quantum security." />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/boot.js"></script>
    <script type="module" src="/src/app/main.ts"></script>
  </head>
  <body class="rh-app">
    <a class="rh-skip" href="#view">Skip to content</a>
    <div class="rh-shell" data-nav="closed">
      <aside class="rh-side" id="rh-side" aria-label="Migration layer">
        <div class="rh-side__brand">
          <a class="rh-mark" href="/" aria-label="Raho home" data-arrive>
            <svg viewBox="0 0 100 50" width="44" height="22" aria-hidden="true"><path class="rh-mark__chevron" d="M56 4 100 22.5v9L56 50V36.5L81 27 56 17.5Z" /><path class="rh-mark__gate" d="M0 50V8a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v42H34V14H14v36Z" /></svg>
            <span class="rh-wordmark">raho</span>
          </a>
          <span class="rh-dimension">Migration layer</span>
        </div>
        <nav class="rh-side__nav" aria-label="Sections" data-side-nav></nav>
        <div class="rh-side__foot">
          <div class="rh-side__status" data-side-status></div>
          <div class="rh-side__row">
            <a class="rh-btn rh-btn--quiet" href="/">Home</a>
            <a class="rh-link" href="#/settings">Settings</a>
          </div>
        </div>
      </aside>
      <div class="rh-scrim" data-action="close-nav" aria-hidden="true"></div>

      <div class="rh-main">
        <header class="rh-top">
          <button type="button" class="rh-icon-btn rh-top__burger" data-action="open-nav" aria-controls="rh-side" aria-expanded="false" aria-label="Open navigation">
            <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M0 1h18M0 6h18M0 11h18" stroke="currentColor" stroke-width="1.5" /></svg>
          </button>
          <div class="rh-top__title">
            <span class="rh-kicker" data-view-kicker>Overview</span>
            <h1 class="rh-top__h1" data-view-title>Overview</h1>
          </div>
          <div class="rh-top__actions">
            <span class="rh-demo-pill" data-demo-pill title="Live network">Live</span>
            <button type="button" class="rh-btn rh-btn--quiet rh-wallet-btn" data-action="connect-wallet" data-wallet-btn>Connect wallet</button>
            <a class="rh-btn rh-btn--sm" href="#/migrate">Open migration</a>
          </div>
        </header>
        <main class="rh-view" id="view" tabindex="-1" data-view></main>
      </div>
    </div>

    <dialog class="rh-modal" data-modal aria-labelledby="rh-modal-title"></dialog>
    <div class="rh-toasts" data-toasts aria-live="polite"></div>
  </body>
</html>
